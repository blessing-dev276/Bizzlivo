<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/logo-192.png" />
    <link rel="apple-touch-icon" href="/logo-192.png" />
    <link rel="mask-icon" href="/favicon.svg" color="#2f6bf0" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0d12" />
    <meta name="color-scheme" content="dark light" />
    <title>Bizzlivo</title>
    <meta name="description" content="Bizzlivo — the digital business office for network-marketing and freelancing teams." />
    <meta property="og:title" content="Bizzlivo" />
    <meta property="og:description" content="The digital business office for network-marketing and freelancing teams." />
    <meta property="og:image" content="https://bizzlivo.com/logo-512.png" />
    <meta name="twitter:card" content="summary" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          // Dark is the primary theme everywhere. The OS preference is
          // ignored — only an explicit in-app choice switches to light.
          var stored = localStorage.getItem('bizzlivo-theme') || localStorage.getItem('hq360-theme');
          var theme = stored === 'light' || stored === 'dark' ? stored : 'dark';
          document.documentElement.setAttribute('data-theme', theme);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'light' ? '#f3f4f6' : '#0a0d12');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
